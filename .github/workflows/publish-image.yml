name: Publish images

on:
  push:
    branches:
      - main

concurrency:
  # Keep candidate validation and alias promotion in one lock.
  group: publish-images-promotion
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}
  APPHOST_IMAGE: ghcr.io/${{ github.repository }}-apphost

jobs:
  prepare:
    name: Validate release identity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.release.outputs.candidate }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Derive candidates and aliases
        id: release
        run: python3 scripts/release_policy.py prepare >> "$GITHUB_OUTPUT"

  validate:
    name: Build and test this commit
    needs: prepare
    uses: ./.github/workflows/pr-gate.yml
    with:
      skip-container-build: true

  build-api:
    name: Build immutable API candidate
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ needs.prepare.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=publish-api-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=publish-api-${{ github.ref }}

  build-apphost:
    name: Build immutable AppHost candidate
    needs:
      - prepare
      - build-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AppHost candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.apphost
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.APPHOST_IMAGE }}:${{ needs.prepare.outputs.candidate }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.release_version }}
          build-args: |
            API_IMAGE=${{ env.API_IMAGE }}@${{ needs.build-api.outputs.digest }}
            RELEASE_VERSION=${{ needs.prepare.outputs.release_version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=publish-apphost-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=publish-apphost-${{ github.ref }}

  smoke:
    name: Smoke exact candidates (${{ matrix.arch }})
    needs:
      - prepare
      - build-api
      - build-apphost
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native candidate identity
        env:
          ARCH: ${{ matrix.arch }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          APPHOST_DIGEST: ${{ needs.build-apphost.outputs.digest }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) exit 1 ;;
          esac
          for image in "${API_IMAGE}@${API_DIGEST}" "${APPHOST_IMAGE}@${APPHOST_DIGEST}"; do
            docker pull --platform "linux/$ARCH" "$image"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "linux/$ARCH"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          done
          docker image inspect "${APPHOST_IMAGE}@${APPHOST_DIGEST}" |
            jq -e --arg api "HostConfiguration__Image=${API_IMAGE}@${API_DIGEST}" '.[0].Config.Env | index($api) != null'

      - name: Run lifecycle and data smoke test
        env:
          INSTALLATION_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          APPHOST_DIGEST: ${{ needs.build-apphost.outputs.digest }}
          ENGINE_CONFIG_DIRECTORY: ${{ runner.temp }}/controller-docker
          DOCKER_CONFIG: ${{ runner.temp }}/controller-docker
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          scripts/smoke-apphost-container.sh "${APPHOST_IMAGE}@${APPHOST_DIGEST}"

      - name: Remove controller registry credentials
        if: always()
        run: rm -rf "${{ runner.temp }}/controller-docker"

      - name: Record candidate evidence
        if: always()
        env:
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          APPHOST_DIGEST: ${{ needs.build-apphost.outputs.digest }}
        run: |
          {
            echo "API candidate: ${API_IMAGE}@${API_DIGEST}"
            echo "AppHost candidate: ${APPHOST_IMAGE}@${APPHOST_DIGEST}"
            docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
            uname -a
          } > container-smoke-evidence.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apphost-container-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: container-smoke-evidence.txt
          if-no-files-found: warn

  promote:
    name: Promote tested digests
    needs:
      - prepare
      - build-api
      - build-apphost
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate read-only Git queries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote API and AppHost aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          APPHOST_DIGEST: ${{ needs.build-apphost.outputs.digest }}
        run: |
          set -euo pipefail
          # Re-read source refs inside the promotion lock before any registry mutation.
          policy="$(python3 scripts/release_policy.py aliases)"
          aliases="${policy#aliases=}"
          while IFS= read -r alias; do
            docker buildx imagetools create --tag "${API_IMAGE}:${alias}" "${API_IMAGE}@${API_DIGEST}"
          done < <(jq -r '.[]' <<< "$aliases")

          while IFS= read -r alias; do
            docker buildx imagetools create --tag "${APPHOST_IMAGE}:${alias}" "${APPHOST_IMAGE}@${APPHOST_DIGEST}"
          done < <(jq -r '.[]' <<< "$aliases")
