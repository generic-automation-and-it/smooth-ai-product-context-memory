name: PR Gate

on:
  push:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - Dockerfile
      - Dockerfile.apphost
      - .dockerignore
      - Directory.Build.props
      - NuGet.Config
      - '*.slnx'
      - src/**
      - tests/**
      - scripts/**
      - npm/**
      - package.json
      - .agents/skills/mimisbrunnr-context-memory/**
      - .agents/skills/mimisbrunnr-understanding/**
      - .agents/skills/mimisbrunnr-dossier/**
      - .agents/skills/ai-understanding/**
      - .agents/agents/memory-read.md
      - .agents/agents/memory-write.md
      - .github/agents/memory-read.agent.md
      - .github/agents/memory-write.agent.md
      - .mcp.json
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/pr-gate.yml
      - .github/workflows/publish-image.yml
  pull_request:
    branches:
      - main
    paths:
      - Directory.Packages.props
      - Dockerfile
      - Dockerfile.apphost
      - .dockerignore
      - Directory.Build.props
      - NuGet.Config
      - '*.slnx'
      - src/**
      - tests/**
      - scripts/**
      - npm/**
      - package.json
      - .agents/skills/mimisbrunnr-context-memory/**
      - .agents/skills/mimisbrunnr-understanding/**
      - .agents/skills/mimisbrunnr-dossier/**
      - .agents/skills/ai-understanding/**
      - .agents/agents/memory-read.md
      - .agents/agents/memory-write.md
      - .github/agents/memory-read.agent.md
      - .github/agents/memory-write.agent.md
      - .mcp.json
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/pr-gate.yml
      - .github/workflows/publish-image.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-container-build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      BUILD_CONFIGURATION: Release
      DOTNET_VERSION: 10.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release policy
        run: python3 -B -m unittest discover -s scripts -p 'test_release_policy.py' -v

      - name: Test credential guard
        run: bash .github/scripts/test-opencode-credential-guard.sh

      - name: Test credential provisioner
        run: bash scripts/test-provision-credentials.sh

      - name: Test context-memory skill
        run: |
          python3 -B .agents/skills/mimisbrunnr-context-memory/tests/run_tests.py
          python3 -B .agents/skills/mimisbrunnr-context-memory/tests/measure_cost.py

      - name: Test understanding skill
        run: |
          python3 -B .agents/skills/mimisbrunnr-understanding/tests/run_tests.py
          python3 -B .agents/skills/mimisbrunnr-understanding/tests/run_walk_tests.py

      - name: Test dossier skill
        run: python3 -B .agents/skills/mimisbrunnr-dossier/tests/run_tests.py

      - name: Test ai-understanding skill
        run: python3 -B .agents/skills/ai-understanding/tests/run_tests.py

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Verify formatting
        run: dotnet format SmoothAiProductContextMemory.slnx --verify-no-changes --no-restore

      - name: Test controller preflight and lifecycle
        run: python3 scripts/test-apphost-entrypoint.py

      - name: Aspire test with coverage
        uses: ./.github/actions/aspire-test-with-coverage
        timeout-minutes: 25
        with:
          build-configuration: ${{ env.BUILD_CONFIGURATION }}
          artifacts-root: artifacts

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f artifacts/coverage/SummaryGithub.md ]; then
            cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage/
          if-no-files-found: warn

  container-build:
    name: Build container images (${{ matrix.arch }})
    if: ${{ !inputs.skip-container-build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read

    # Release mode refuses a Host image that is not digest-pinned, and a digest only exists once an
    # image is in a registry. A job-local registry gives both images a real digest without
    # publishing anything; the engine treats localhost registries as insecure-allowed, so the
    # controller's engine pulls the API image from it exactly as it pulls from GHCR on main.
    services:
      registry:
        image: docker.io/library/registry:2
        ports:
          - 5000:5000

    env:
      DOCKER_BUILD_RECORD_UPLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      LOCAL_API_IMAGE: localhost:5000/smooth-ai-product-context-memory
      LOCAL_APPHOST_IMAGE: localhost:5000/smooth-ai-product-context-memory-apphost

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The BuildKit container must reach the job-local registry on the runner's loopback.
          driver-opts: network=host

      - name: Build API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.LOCAL_API_IMAGE }}:pr
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=pr-api-${{ github.ref }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-api-${{ github.ref }}-${{ matrix.arch }}

      - name: Build AppHost controller image
        id: apphost
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.apphost
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.LOCAL_APPHOST_IMAGE }}:pr
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            API_IMAGE=${{ env.LOCAL_API_IMAGE }}@${{ steps.api.outputs.digest }}
            RELEASE_VERSION=pr-${{ github.event.pull_request.number || github.run_number }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=pr-apphost-${{ github.ref }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-apphost-${{ github.ref }}-${{ matrix.arch }}

      # The same smoke the main publication pipeline runs against its candidates, so a change that
      # breaks container startup fails here instead of only after merge.
      - name: Run lifecycle and data smoke test
        env:
          ARCH: ${{ matrix.arch }}
          INSTALLATION_ID: pr-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          APPHOST_DIGEST: ${{ steps.apphost.outputs.digest }}
        run: |
          set -euo pipefail
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "runner architecture $(uname -m) does not match matrix arch $ARCH" >&2; exit 1 ;;
          esac
          docker pull --platform "linux/$ARCH" "${LOCAL_APPHOST_IMAGE}@${APPHOST_DIGEST}"
          docker image inspect "${LOCAL_APPHOST_IMAGE}@${APPHOST_DIGEST}" |
            jq -e --arg api "HostConfiguration__Image=${LOCAL_API_IMAGE}@${API_DIGEST}" '.[0].Config.Env | index($api) != null'
          scripts/smoke-apphost-container.sh "${LOCAL_APPHOST_IMAGE}@${APPHOST_DIGEST}"
