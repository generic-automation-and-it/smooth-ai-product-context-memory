<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Mímisbrunnr — Smooth AI Product Context Memory. Reasoning that outlives the session. Drawn from Mímisbrunnr, not lost with it — four keepers, one judge, one wellspring, the why still attached.</title>
  <desc id="desc">Private local memory for AI-assisted work. Capture at a checkpoint through an AI skill; the HTTP API owns mechanics. Four-level hybrid storage around Mímisbrunnr (Mímir's wellspring): Týr the relational PostgreSQL index, Loki the JSONB long tail, Urðr the Apache AGE graph edges, and Iðunn the content-addressed blob store — five nodes in a star with Forseti the LLM judge, ringed by an original rune ring. Mímir's eye watches from the water, Huginn and Muninn aloft. Single-user, offline, evidence not instruction.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#0E1528"/>
      <stop offset="100%" stop-color="#10182C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E32"/>
      <stop offset="100%" stop-color="#12182A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3EE0B8"/>
      <stop offset="50%" stop-color="#6EA8FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="50%" cy="52%" r="62%">
      <stop offset="0%" stop-color="#1C2744" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#12192C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6EA8FF" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#3EE0B8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wellWater" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#2A4A6E"/>
      <stop offset="55%" stop-color="#0E2438"/>
      <stop offset="100%" stop-color="#071018"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

