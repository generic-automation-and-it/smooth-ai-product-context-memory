    <text x="60" y="250" fill="#5C6B84" font-size="10" font-weight="700" letter-spacing="1.6">HLD 002 · WRITE PIPELINE</text>

    <rect x="60" y="260" width="132" height="40" rx="9" fill="#14302C" stroke="#2A6B5C"/>
    <text x="74" y="285" fill="#3EE0B8" font-size="11" font-weight="700">1 Preflight</text>
