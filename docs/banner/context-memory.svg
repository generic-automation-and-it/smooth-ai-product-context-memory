    <text x="214" y="285" fill="#3EE0B8" font-size="11" font-weight="700">2 Redact</text>
    <rect x="332" y="260" width="148" height="40" rx="9" fill="#14302C" stroke="#2A6B5C"/>
    <text x="346" y="285" fill="#3EE0B8" font-size="11" font-weight="700">3 Dedupe · links</text>
    <rect x="488" y="260" width="124" height="40" rx="9" fill="#14302C" stroke="#2A6B5C"/>
    <text x="502" y="285" fill="#3EE0B8" font-size="11" font-weight="700">4 Atomicity</text>
    <rect x="620" y="260" width="138" height="40" rx="9" fill="#14302C" stroke="#2A6B5C"/>
    <text x="634" y="285" fill="#3EE0B8" font-size="11" font-weight="700">5 Write</text>

    <text x="60" y="332" fill="#5C6B84" font-size="10" font-weight="700" letter-spacing="1.6">WHAT STAYS TRUE</text>
    <text x="60" y="358" fill="#F2F5FA" font-size="14" font-weight="700">Skill judges. API enforces. Four gods around the well.</text>
    <text x="60" y="382" fill="#93A0B8" font-size="12">Evidence, not orders — a claim to weigh, never a command from the well.</text>
    <text x="60" y="402" fill="#93A0B8" font-size="12">The chain is Urðr’s: measurement, finding, decision.</text>

    <rect x="60" y="424" width="210" height="44" rx="10" fill="#1B2338" stroke="#33405C"/>
    <text x="76" y="451" fill="#F2F5FA" font-size="12" font-weight="600">Zero dedicated upkeep</text>
    <rect x="282" y="424" width="210" height="44" rx="10" fill="#1B2338" stroke="#33405C"/>
    <text x="298" y="451" fill="#F2F5FA" font-size="12" font-weight="600">Yours · offline · private</text>
    <rect x="504" y="424" width="254" height="44" rx="10" fill="#1B2338" stroke="#33405C"/>
    <text x="520" y="451" fill="#F2F5FA" font-size="12" font-weight="600">Cross-product recall</text>
    <text x="60" y="500" fill="#5C6B84" font-size="11">Four gods around the well. Evidence, not orders. Urðr holds the chain.</text>
  </g>

