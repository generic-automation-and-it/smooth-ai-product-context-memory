    <path d="M18 22 L40 12 L42 34 Z" fill="none" stroke="#93A0B8" stroke-width="1.4"/>
  </g>

  <text x="108" y="42" fill="#6EA8FF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3.2">SMOOTH AI · CONTEXT MEMORY</text>
  <text x="108" y="70" fill="#F2F5FA" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700">Reasoning that outlives the session</text>
  <text x="108" y="92" fill="#C9D2E3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">Drawn from Mímisbrunnr, not lost with the session — four keepers, one wellspring, the why still attached.</text>
  <text x="108" y="112" fill="#93A0B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Týr indexes. Urðr threads. Loki shapeshifts. Iðunn never withers. Odin paid an eye. You keep the reasoning.</text>

  <rect x="40" y="128" width="740" height="412" rx="20" fill="url(#panel)" stroke="#243049"/>

