    <text x="60" y="332" fill="#5C6B84" font-size="10" font-weight="700" letter-spacing="1.6">WHAT STAYS TRUE</text>
    <text x="60" y="358" fill="#F2F5FA" font-size="14" font-weight="700">Skill judges. API enforces. Four gods around the well.</text>
    <text x="60" y="382" fill="#93A0B8" font-size="12">Evidence, not orders — a claim to weigh, never a command from the well.</text>
    <text x="60" y="402" fill="#93A0B8" font-size="12">The chain is Urðr’s: measurement, finding, decision.</text>

    <rect x="60" y="424" width="165" height="44" rx="10" fill="#1B2338" stroke="#33405C"/>
    <text x="142" y="451" text-anchor="middle" fill="#F2F5FA" font-size="11" font-weight="600" textLength="148" lengthAdjust="spacingAndGlyphs">Zero dedicated upkeep</text>
    <rect x="237" y="424" width="165" height="44" rx="10" fill="#1B2338" stroke="#33405C"/>
    <text x="319" y="451" text-anchor="middle" fill="#F2F5FA" font-size="11" font-weight="600" textLength="148" lengthAdjust="spacingAndGlyphs">Yours · offline · private</text>
    <rect x="414" y="424" width="165" height="44" rx="10" fill="#1B2338" stroke="#33405C"/>
    <text x="496" y="451" text-anchor="middle" fill="#F2F5FA" font-size="11" font-weight="600" textLength="148" lengthAdjust="spacingAndGlyphs">Cross-product recall</text>
    <rect x="591" y="424" width="165" height="44" rx="10" fill="#1B2338" stroke="#3EE0B8"/>
    <text x="673" y="443" text-anchor="middle" fill="#F2F5FA" font-size="10" font-weight="600">validation of value</text>
    <text x="673" y="457" text-anchor="middle" fill="#F2F5FA" font-size="10" font-weight="600">with LLM decisions</text>
    <text x="60" y="500" fill="#5C6B84" font-size="11">Four keepers, one judge around the well. Evidence, not orders. Urðr holds the chain.</text>
