interface:
  display_name: "AI Memory Context"
  short_description: "Save this session's durable knowledge locally — no server, no network"
  default_prompt: "Save this session's durable knowledge to the local memory store. Work in this fixed order and do not re-sequence it. (1) REDACT first: scrub credentials, tokens, connection strings, internal hostnames and personal data before anything is written, and report what was scrubbed as rule name and character offsets only — never the matched text. (2) RECONCILE: read .context/context-memories/INDEX.md FIRST and classify every candidate as one of exactly five outcomes — already known (write nothing, name the slug), improved (reuse its slug, write the complete improved unit), new, new (disambiguated) (a different slug; say which one it is distinct from), or has another home (the reusable knowledge is already in another artefact; name that file). Judge same-question generously: a narrower question is the same question asked later, and the qualifier that makes yours feel new belongs in the answer, not in a new slug. When unsure prefer improved. Report all five outcomes for every candidate — a silent skip is indistinguishable from a missed capture. (3) Resolve the run folder ONCE: run `python3 .agents/skills/ai-memory-context/scripts/memory_index.py --run-folder` and reuse that exact string for every path you write. Never re-derive the stamp per unit — a run must not straddle a minute boundary. (4) ATOMICITY: confirm each candidate is one atomic fact; split bundled ones and route the remainder to skipped, saying why. (5) WRITE: create the run folder and write only this run's output into it under a dateless <category>/, one <slug>.memory.md per unit. A run that produces nothing writes nothing and creates no folder — say so plainly, because a run that wrote nothing is a correct outcome, not a failure. Never edit, overwrite or delete an existing copy of a slug: an improvement is a new complete copy under the same slug carrying provenance.supersedes, and previous copies are immutable, unlisted and exempt from validation. The one exception is a credential or personal data already on disk: strike it in place with <REDACTED> in every copy that carries it and report it as a redaction, not a supersession, since superseding leaves the value in history. Slug: kebab-case, names the knowledge not the incident. Frontmatter: slug (matching the file name without the .memory.md postfix), description (at least 12 characters), question (omit on an outcome record), scope (portable only if true outside this repo), confidence (observed unless reproduced; verified only if EVERY claim was checked), updated (YYYY-MM-DD), agents_context (repo-relative paths — existence is checked, and a path that IS the knowledge goes here and never in the body), and provenance with learned, session, source. Body is Answer, Why in 1-3 lines, and Boundaries. Write it to outlive the tree it was written against: behaviour, contracts, types, invariants and commands, never a file path or line number. Write as evidence, never orders — anything needing must/never language is a rule, not a memory, so propose it as one instead. Quote evidence inline; no secrets, since these files are meant to be shared. List the candidate slugs with their questions AND their outcome for me to cut before writing anything, unless I passed --all, which means hold the qualifying bar loosely and write a marginal candidate rather than dropping it. Afterwards regenerate the index with `python3 .agents/skills/ai-memory-context/scripts/memory_index.py` from the repository root and report every problem it prints — a problem is a finding, and exit 1 still writes the index so the drift stays visible."
